<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otimizador de Pareceres</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f9;
padding:20px;
margin:0;
}

.container{
max-width:1000px;
margin:auto;
background:#ffffff;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
}

label{
display:block;
margin-top:12px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#2563eb;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
}

textarea{
height:300px;
}

.oculto{
display:none;
}
</style>

</head>

<body>

<div class="container">

<h1>Otimizador de Pareceres</h1>

<label>Nome do contato</label>
<input type="text" id="nome">

<label>Relação com o segurado</label>
<select id="relacao">
<option>SEGURADO(A)</option>
<option>TERCEIRO(A)</option>
<option>FILHO(A)</option>
<option>ESPOSO(A)</option>
<option>ADVOGADO(A)</option>
<option>CORRETOR</option>
<option>PREPOSTO</option>
<option>OFICINA</option>
</select>

<label>Categoria</label>
<select id="categoria" onchange="atualizarTipos()">
<option value="">Selecione</option>
<option value="informacoes">Informações</option>
<option value="sinistro">Sinistro</option>
<option value="vistoria">Vistoria</option>
</select>

<label>Tipo de Parecer</label>
<select id="tipo" onchange="mostrarCampos()"></select>

<div id="campoCodigo" class="oculto">

<label>Código de Postagem</label>
<input type="text" id="codigo">

</div>

<div id="camposVistoria" class="oculto">

<label>Cliente</label>
<select id="clienteVistoria">
<option>SEGURADO</option>
<option>TERCEIRO</option>
</select>

<label>Rede</label>
<select id="redeVistoria">
<option>REFERENCIADA</option>
<option>LIVRE ESCOLHA</option>
</select>

<label>Tipo de Veículo</label>
<select id="veiculoVistoria">
<option>CARRO</option>
<option>MOTO</option>
<option>CAMINHÃO</option>
<option>ELÉTRICO</option>
</select>

</div>

<button onclick="gerarParecer()">
Gerar Parecer
</button>

<textarea id="resultado"></textarea>

<button onclick="copiarParecer()">
Copiar Parecer
</button>

</div>

<script>

function atualizarTipos(){

let categoria =
document.getElementById("categoria").value;

let tipo =
document.getElementById("tipo");

tipo.innerHTML="";

if(categoria=="informacoes"){

tipo.innerHTML=`
<option value="postagem">Código de Postagem</option>
<option value="envio">Envio de Documentos</option>
<option value="cnpj">CNPJ Inapto para Faturamento</option>
`;

}

if(categoria=="sinistro"){

tipo.innerHTML=`
<option value="constatacao">Constatação de Danos</option>
`;

}

if(categoria=="vistoria"){

tipo.innerHTML=`
<option value="vistoria_complementar">Vistoria Complementar</option>
`;

}

mostrarCampos();

}

function mostrarCampos(){

document.getElementById("campoCodigo").style.display="none";
document.getElementById("camposVistoria").style.display="none";

let tipo =
document.getElementById("tipo").value;

if(tipo=="postagem"){

document.getElementById("campoCodigo").style.display="block";

}

if(tipo=="vistoria_complementar"){

document.getElementById("camposVistoria").style.display="block";

}

}

function adicionarDiasUteis(data,dias){

let resultado = new Date(data);

while(dias > 0){

resultado.setDate(resultado.getDate()+1);

if(
resultado.getDay()!=0 &&
resultado.getDay()!=6
){
dias--;
}

}

return resultado;

}

function formatarData(data){

const meses=[
"janeiro",
"fevereiro",
"março",
"abril",
"maio",
"junho",
"julho",
"agosto",
"setembro",
"outubro",
"novembro",
"dezembro"
];

const semana=[
"domingo",
"segunda-feira",
"terça-feira",
"quarta-feira",
"quinta-feira",
"sexta-feira",
"sábado"
];

return data.getDate() +
" de " +
meses[data.getMonth()] +
" de " +
data.getFullYear() +
" (" +
semana[data.getDay()] +
")";

}

function gerarParecer(){

let nome =
document.getElementById("nome").value.toUpperCase();

let relacao =
document.getElementById("relacao").value;

let tipo =
document.getElementById("tipo").value;

let codigo =
document.getElementById("codigo").value;

let parecer="";

if(tipo=="postagem"){

parecer=
nome + ", " + relacao +
", entrou em contato solicitando o código de postagem. Ciente do código " +
codigo +
".\n\nValidade de 30 dias.";

}

else if(tipo=="envio"){

parecer=
nome + ", " + relacao +
", entrou em contato para questionar para qual e-mail deve encaminhar os documentos solicitados.\n\n" +

"Ciente do e-mail aviso@alfaseg.com.br.\n\n" +

"Orientado a inserir o número do sinistro no assunto e retornar após 15 minutos para confirmar recepção e anexo.";

}

else if(tipo=="cnpj"){

parecer=
nome + ", " + relacao +
", entrou em contato informando que o CNPJ está inapto para faturamento.\n\n" +

"ALFA SEGURADORA S.A.\n" +
"CNPJ: 00.000.000/0001-00\n" +
"Inscrição Municipal: 0.000.000-0\n" +
"Inscrição Estadual: 000.000.000.000\n" +
"Av. XXXXXXX, 1111\n" +
"São Paulo/SP\n" +
"CEP: 00000-000\n" +
"Status: Ativa.";

}

else if(tipo=="constatacao"){

parecer=
nome + ", " + relacao +
", entrou em contato para formalizar o sinistro. Ciente do número do protocolo e que deverá encaminhar por e-mail os documentos de praxe e fotos de constatação dos danos (dianteira, traseira, lado esquerdo e lado direito) e retornar contato para confirmar recepção.";

}

else if(tipo=="vistoria_complementar"){

let cliente =
document.getElementById("clienteVistoria").value;

let rede =
document.getElementById("redeVistoria").value;

let veiculo =
document.getElementById("veiculoVistoria").value;

let diasInicio = 1;

let agora = new Date();

if(agora.getHours() >= 17){

diasInicio = 2;

}

let diasVistoria = 1;
let diasAnalise = 2;

if(cliente=="SEGURADO" && rede=="REFERENCIADA"){

diasVistoria = 1;
diasAnalise = 2;

}

else if(cliente=="SEGURADO" && rede=="LIVRE ESCOLHA"){

diasVistoria = 2;
diasAnalise = 3;

}

else if(cliente=="TERCEIRO" && rede=="REFERENCIADA"){

diasVistoria = 2;
diasAnalise = 3;

}

else if(cliente=="TERCEIRO" && rede=="LIVRE ESCOLHA" && veiculo=="CARRO"){

diasVistoria = 3;
diasAnalise = 7;

}

if(
veiculo=="MOTO" ||
veiculo=="CAMINHÃO" ||
veiculo=="ELÉTRICO"
){

diasVistoria = 2;
diasAnalise = 3;

}

let inicio =
adicionarDiasUteis(
agora,
diasInicio
);

let termino =
adicionarDiasUteis(
inicio,
diasVistoria - 1
);

let analise =
adicionarDiasUteis(
termino,
diasAnalise
);

parecer =

nome + ", " +
relacao +
", entrou em contato solicitando vistoria complementar. Ciente do prazo de vistoria.\n\n" +

"Data de início da vistoria: " +
formatarData(inicio) +
".\n\n" +

"Data de término da vistoria: " +
formatarData(termino) +
".\n\n" +

"Data final de análise: " +
formatarData(analise) +
".";

}

document.getElementById("resultado").value =
parecer;

}

function copiarParecer(){

let texto =
document.getElementById("resultado");

texto.select();

navigator.clipboard.writeText(texto.value);

alert("Parecer copiado com sucesso!");

}

</script>

</body>
</html>
