<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otimizador de Pareceres</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f9;
padding:20px;
max-width:900px;
margin:auto;
}

.container{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
text-align:center;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:5px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#2563eb;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}

textarea{
height:200px;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Gerador de Pareceres</h1>

<label>Nome do contato</label>
<input type="text" id="nome">

<label>Relação com o segurado</label>
<select id="relacao">
<option>SEGURADO(A)</option>
<option>TERCEIRO(A)</option>
<option>FILHO(A)</option>
<option>FILHA</option>
<option>ESPOSO(A)</option>
<option>ADVOGADO(A)</option>
<option>CORRETOR(A)</option>
<option>OFICINA</option>
</select>

<label>Tipo de parecer</label>
<select id="tipo">
<option value="postagem">Código de Postagem</option>
<option value="retorno">Cobrança de Retorno</option>
</select>

<label>Código</label>
<input type="text" id="codigo">

<label>Validade (dias)</label>
<input type="number" id="validade" value="30">

<button onclick="gerarParecer()">
Gerar Parecer
</button>

<textarea id="resultado"></textarea>

<button onclick="copiarParecer()">
Copiar Parecer
</button>

</div>

<script>

function gerarParecer(){

var nome = document.getElementById("nome").value.toUpperCase();
var relacao = document.getElementById("relacao").value;
var tipo = document.getElementById("tipo").value;
var codigo = document.getElementById("codigo").value;
var validade = document.getElementById("validade").value;

var parecer = "";

if(tipo=="postagem"){

parecer =
nome + ", " + relacao +
", entrou em contato solicitando o código de postagem. Ciente do código " +
codigo +
".\n\nValidade de " +
validade +
" dias.";

}

if(tipo=="retorno"){

parecer =
nome + ", " + relacao +
", entrou em contato solicitando posicionamento do processo.\n\nVerificado ausência de retorno dentro do prazo informado.\n\nFale Conosco registrado para cobrança junto ao analista responsável.\n\nOrientado a aguardar retorno da área responsável.";

}

document.getElementById("resultado").value = parecer;

}

function copiarParecer(){

var texto = document.getElementById("resultado");

texto.select();

navigator.clipboard.writeText(texto.value);

alert("Parecer copiado com sucesso!");

}

</script>

</body>
</html>
