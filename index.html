<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otimizador de Pareceres</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
padding:20px;
margin:0;
}

.container{
max-width:1000px;
margin:auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
text-align:center;
}

label{
display:block;
font-weight:bold;
margin-top:12px;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

textarea{
height:260px;
}

.oculto{
display:none;
}

</style>

</head>

<body>

<div class="container">

<h1>Otimizador de Pareceres</h1>

<label>Nome do contato</label>
<input type="text" id="nome">

<label>Relação com o segurado</label>
<select id="relacao">
<option>SEGURADO</option>
<option>TERCEIRO</option>
<option>FILHO(A)</option>
<option>ESPOSA(O)</option>
<option>ADVOGADO</option>
<option>CORRETOR</option>
<option>PREPOSTO</option>
<option>OFICINA</option>
</select>

<label>Categoria</label>
<select id="categoria" onchange="atualizarTipos()">
<option value="">Selecione</option>
<option value="informacoes">Informações</option>
<option value="sinistro">Sinistro</option>
<option value="vistoria">Vistoria</option>
</select>

<label>Tipo de Parecer</label>
<select id="tipo" onchange="mostrarCampos()">
</select>

<div id="campoCodigo" class="oculto">

<label>Código de Postagem</label>
<input type="text" id="codigo">

</div>

<button onclick="gerarParecer()">
Gerar Parecer
</button>

<textarea id="resultado"></textarea>

<button onclick="copiarParecer()">
Copiar Parecer
</button>

</div>

<script>

function atualizarTipos(){

let categoria =
document.getElementById("categoria").value;

let tipo =
document.getElementById("tipo");

tipo.innerHTML="";

if(categoria=="informacoes"){

tipo.innerHTML = `
<option value="postagem">Código de Postagem</option>
<option value="envio">Envio de Documentos</option>
<option value="cnpj">CNPJ Inapto para Faturamento</option>
`;

}

if(categoria=="sinistro"){

tipo.innerHTML = `
<option value="constatacao">Constatação de Danos</option>
`;

}

if(categoria=="vistoria"){

tipo.innerHTML = `
<option value="vistoria_complementar">Vistoria Complementar</option>
`;

}

mostrarCampos();

}

function mostrarCampos(){

let tipo =
document.getElementById("tipo").value;

document.getElementById("campoCodigo").style.display="none";

if(tipo=="postagem"){

document.getElementById("campoCodigo").style.display="block";

}

}

function adicionarDiasUteis(data,dias){

let resultado = new Date(data);

while(dias>0){

resultado.setDate(resultado.getDate()+1);

if(
resultado.getDay()!=0 &&
resultado.getDay()!=6
){

dias--;

}

}

return resultado;

}

function formatarData(data){

const meses=[
"janeiro",
"fevereiro",
"março",
"abril",
"maio",
"junho",
"julho",
"agosto",
"setembro",
"outubro",
"novembro",
"dezembro"
];

const semana=[
"domingo",
"segunda-feira",
"terça-feira",
"quarta-feira",
"quinta-feira",
"sexta-feira",
"sábado"
];

return data.getDate()
+ " de "
+ meses[data.getMonth()]
+ " de "
+ data.getFullYear()
+ " ("
+ semana[data.getDay()]
+ ")";

}

function gerarParecer(){

let nome =
document.getElementById("nome").value.toUpperCase();

let relacao =
document.getElementById("relacao").value;

let tipo =
document.getElementById("tipo").value;

let codigo =
document.getElementById("codigo").value;

let parecer = "";

if(tipo=="postagem"){

parecer =
nome + ", " +
relacao +
", entrou em contato solicitando o código de postagem. Ciente do código " +
codigo +
".\n\nValidade de 30 dias.";

}

if(tipo=="envio"){

parecer =
nome + ", " +
relacao +
", entrou em contato para questionar para qual e-mail deve encaminhar os documentos solicitados.\n\n" +

"Ciente do e-mail aviso@alfaseg.com.br.\n\n" +

"Orientado a inserir o número do sinistro no assunto e retornar após 15 minutos para confirmar recepção e anexo.";

}

if(tipo=="cnpj"){

parecer =
nome + ", " +
relacao +
", entrou em contato informando que o CNPJ está inapto para faturamento.\n\n" +

"ALFA SEGURADORA S.A.\n" +

"CNPJ: 02.713.529/0001-88\n" +

"Inscrição Municipal: 2.735.513-6\n" +

"Inscrição Estadual: 115.550.340.117\n" +

"Av. Paulista, 2150\n" +

"São Paulo/SP\n" +

"CEP: 01310-300\n" +

"Status: Ativa.";

}

if(tipo=="constatacao"){

parecer =
nome + ", " +
relacao +
", entrou em contato para formalizar o sinistro. Ciente do número do protocolo e que deverá encaminhar por e-mail os documentos de praxe e fotos de constatação dos danos (dianteira, traseira, lado esquerdo e lado direito) e retornar contato para confirmar recepção.";

}

if(tipo=="vistoria_complementar"){

let agora = new Date();

let diasInicio = 1;

if(agora.getHours() >= 17){

diasInicio = 2;

}

let inicio =
adicionarDiasUteis(
agora,
diasInicio
);

let termino =
new Date(inicio);

let analise =
adicionarDiasUteis(
termino,
2
);

parecer =

"Entrou em contato solicitando vistoria complementar. Ciente do prazo de vistoria.\n\n" +

"Data de início da vistoria: " +

formatarData(inicio) +

".\n\n" +

"Data de término da vistoria: " +

formatarData(termino) +

".\n\n" +

"Data final de análise: " +

formatarData(analise) +

".";

}

document.getElementById("resultado").value =
parecer;

}

function copiarParecer(){

let texto =
document.getElementById("resultado");

texto.select();

navigator.clipboard.writeText(texto.value);

alert("Parecer copiado com sucesso!");

}

</script>

</body>
</html>
